<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="根据全省负荷与客户负荷加权均价，实时计算江苏电力曲线优势。"
    />
    <title>江苏电力曲线计算器</title>
    <style>
      :root {
        color: #12243b;
        background: #061b33;
        font-family: Inter, "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
        font-synthesis: none;
      }

      * { box-sizing: border-box; }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        padding: 1px 0;
        background:
          radial-gradient(circle at 15% 10%, rgb(14 165 201 / 18%), transparent 32rem),
          #061b33;
      }

      button, input { font: inherit; }

      button:focus-visible, input:focus-visible {
        outline: 3px solid #0ea5c9;
        outline-offset: 2px;
      }

      .app-shell {
        width: min(1600px, calc(100% - 32px));
        margin: 32px auto;
        padding: clamp(24px, 4vw, 52px);
        background: #fff;
        border-radius: 20px;
        box-shadow: 0 24px 64px rgb(0 20 45 / 35%);
      }

      .topbar, .panel-heading, .result-strip {
        display: flex;
        align-items: center;
      }

      .topbar {
        justify-content: space-between;
        gap: 24px;
        padding-bottom: 32px;
        border-bottom: 1px solid #d8e5ee;
      }

      .section-label, .panel-kicker {
        margin: 0 0 8px;
        color: #087e9e;
        font-size: 0.78rem;
        font-weight: 800;
        letter-spacing: 0.12em;
      }

      h1, h2, p { margin-top: 0; }

      h1 {
        margin-bottom: 10px;
        color: #092c51;
        font-size: clamp(2rem, 4vw, 3.15rem);
        line-height: 1.08;
        letter-spacing: -0.04em;
      }

      .intro {
        margin-bottom: 0;
        color: #5d7184;
      }

      .reset-button {
        flex: 0 0 auto;
        border: 1px solid #0a87aa;
        border-radius: 9px;
        padding: 12px 18px;
        color: #fff;
        background: #0a87aa;
        font-weight: 700;
        cursor: pointer;
        transition: background-color 160ms ease, transform 160ms ease;
      }

      .reset-button:hover {
        background: #056e91;
        transform: translateY(-1px);
      }

      .result-strip {
        gap: 18px;
        margin: 30px 0;
      }

      .result-card {
        flex: 1;
        min-width: 0;
        padding: 22px 24px;
        border: 1px solid #d6e4eb;
        border-radius: 12px;
        background: linear-gradient(135deg, #f5fbfd, #fff);
      }

      .result-card span {
        display: block;
        color: #4c6275;
        font-size: 0.92rem;
        font-weight: 700;
      }

      .result-card output {
        display: block;
        margin-top: 8px;
        color: #c96a22;
        font-size: clamp(1.7rem, 3.5vw, 2.5rem);
        font-weight: 800;
        letter-spacing: -0.04em;
      }

      .input-stack {
        display: grid;
        gap: 22px;
      }

      .curve-panel {
        padding: 24px;
        border: 1px solid #d6e4eb;
        border-radius: 12px;
      }

      .panel-heading {
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 22px;
      }

      h2 {
        margin-bottom: 0;
        color: #102c49;
        font-size: 1.12rem;
      }

      .unit {
        color: #60788b;
        font-size: 0.88rem;
        white-space: nowrap;
      }

      .curve-grid {
        display: grid;
        grid-template-columns: repeat(12, minmax(0, 1fr));
        gap: 12px;
      }

      .curve-chart {
        min-height: 200px;
        margin-top: 24px;
        padding: 12px;
        border: 1px solid #d6e4eb;
        border-radius: 9px;
        background: #f8fcfe;
      }

      .curve-chart svg {
        display: block;
        width: 100%;
        height: 200px;
        overflow: visible;
      }

      .chart-grid-line {
        stroke: #d9e8ef;
        stroke-width: 1;
        vector-effect: non-scaling-stroke;
      }

      .chart-zero-line {
        stroke: #87a9ba;
        stroke-dasharray: 4 4;
        stroke-width: 1;
        vector-effect: non-scaling-stroke;
      }

      .chart-line {
        fill: none;
        stroke: #0a87aa;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 3;
        vector-effect: non-scaling-stroke;
      }

      .chart-point {
        fill: #fff;
        stroke: #0a87aa;
        stroke-width: 2;
        vector-effect: non-scaling-stroke;
      }

      .chart-label {
        fill: #60788b;
        font-size: 11px;
        font-weight: 700;
      }

      .hour-input {
        display: grid;
        gap: 6px;
        color: #537084;
        font-size: 0.75rem;
        font-weight: 700;
      }

      .hour-input input {
        appearance: textfield;
        width: 100%;
        min-width: 0;
        border: 1px solid #bed0dc;
        border-radius: 7px;
        padding: 9px 5px;
        color: #16354e;
        background: #fbfdff;
        font-size: 0.8rem;
        font-variant-numeric: tabular-nums;
        transition: border-color 160ms ease, box-shadow 160ms ease;
      }

      .hour-input input::-webkit-inner-spin-button,
      .hour-input input::-webkit-outer-spin-button {
        margin: 0;
        appearance: none;
      }

      .hour-input input:hover { border-color: #0a87aa; }

      .hour-input input:focus {
        border-color: #0a87aa;
        box-shadow: 0 0 0 3px rgb(14 165 201 / 18%);
      }

      @media (max-width: 1120px) {
        .curve-grid { grid-template-columns: repeat(6, minmax(0, 1fr)); }
      }

      @media (max-width: 640px) {
        .app-shell {
          width: min(100% - 20px, 1320px);
          margin: 10px auto;
          padding: 22px 16px;
          border-radius: 12px;
        }

        .topbar, .result-strip {
          align-items: stretch;
          flex-direction: column;
        }

        .reset-button { width: 100%; }
        .curve-panel { padding: 18px 14px; }

        .panel-heading {
          align-items: flex-start;
          flex-direction: column;
          gap: 8px;
        }

        .curve-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 12px 10px;
        }

        .curve-chart { padding: 8px; }
      }
    </style>
  </head>
  <body>
    <main class="app-shell" id="app">
      <header class="topbar">
        <div>
          <p class="section-label">价格参数</p>
          <h1>江苏电力曲线计算器</h1>
          <p class="intro">基于全省负荷与客户负荷加权均价，实时比较曲线优势。</p>
        </div>
        <button class="reset-button" id="reset-button" type="button">恢复默认值</button>
      </header>

      <section class="result-strip" aria-label="计算结果" aria-live="polite">
        <article class="result-card">
          <span>2026 曲线优势 /厘</span>
          <output id="result-2026">--</output>
        </article>
        <article class="result-card">
          <span>2027 曲线优势 /厘</span>
          <output id="result-2027">--</output>
        </article>
      </section>

      <div class="input-stack">
        <section class="curve-panel" aria-labelledby="curve-2026-title">
          <div class="panel-heading">
            <div>
              <p class="panel-kicker">负荷输入</p>
              <h2 id="curve-2026-title">2026 无光伏客户负荷曲线</h2>
            </div>
            <span class="unit">单位：MWh</span>
          </div>
          <div
            class="curve-grid"
            id="curve-2026"
            role="group"
            aria-label="2026 无光伏客户负荷曲线"
          ></div>
          <div
            class="curve-chart"
            id="curve-chart-2026"
            aria-label="2026 无光伏客户负荷曲线预览"
          ></div>
        </section>

        <section class="curve-panel" aria-labelledby="curve-2027-title">
          <div class="panel-heading">
            <div>
              <p class="panel-kicker">负荷输入</p>
              <h2 id="curve-2027-title">2027 客户负荷曲线</h2>
            </div>
            <span class="unit">单位：MWh</span>
          </div>
          <div
            class="curve-grid"
            id="curve-2027"
            role="group"
            aria-label="2027 客户负荷曲线"
          ></div>
          <div
            class="curve-chart"
            id="curve-chart-2027"
            aria-label="2027 客户负荷曲线预览"
          ></div>
        </section>
      </div>
    </main>

    <script id="calculator-core">
      (() => {
        'use strict';

        const MARKET_CURVE_2026 = [
          341.377140969022, 340.47668641193036, 343.8441940924219, 340.51015031362004,
          339.7030570276497, 338.1970044482847, 327.7814617895545, 322.39622420634925,
          317.7180244175627, 311.44867191500254, 311.15194252432156, 305.9778002752176,
          307.2920234895033, 308.546908250128, 311.02408733358936, 322.58485000640036,
          338.9910652521761, 344.095083141321, 346.0136358806963, 343.6193071556579,
          342.029266641065, 340.78107771531853, 342.0506378968254, 338.2072960189452,
        ];

        const PROVINCE_LOAD = [
          349170.991044776, 339840.463681592, 340498.999502488, 333618.408457711,
          330547.001492537, 331382.034825871, 320328.130845771, 321496.023880597,
          324319.528358209, 316296.960199005, 314252.767164179, 294630.305472637,
          291385.494029851, 296010.185572139, 301095.057711443, 324326.571144279,
          356024.695522388, 374948.485572139, 388228.758208955, 390455.511442786,
          387979.269154229, 379853.138308458, 372049.232338308, 353026.365671642,
        ];

        const DELTA_2027 = [
          15, 15, 20, 20, 20, 20, 15, 15, -10, -30, -80, -100,
          -100, -80, -30, -10, 15, 20, 30, 30, 30, 25, 20, 15,
        ];

        const DEFAULT_NO_PV_2026 = [
          353.66295, 390.1852, 373.8537, 376.16115, 374.91665, 365.9704,
          338.6796, 281.16485, 237.2574, 200.42405, 158.20555, 146.7185,
          138.7852, 165.9648, 195.06115, 250.00555, 292.61665, 350.56485,
          381.3167, 391.3037, 394.38145, 392.58885, 388.60925, 385.0037,
        ];

        const DEFAULT_CUSTOMER_2027 = [
          9945.1357, 12348.4724, 12188.5427, 12216.3668, 12316.005, 13374.8844,
          14851.5075, 15569.4523, 15925.3467, 16259.0251, 16344.9246, 16528.2211,
          16468.0352, 16086.3618, 16357.3317, 16696.7487, 16828.0754, 17174.5025,
          17198.1658, 17166.4422, 16981.9698, 16593.5377, 15981.1558, 19826.7286,
        ];

        const marketCurve2027 = MARKET_CURVE_2026.map(
          (value, index) => value + DELTA_2027[index],
        );

        function toNumbers(values) {
          return values.map((value) => {
            const parsed = Number(value);
            return Number.isFinite(parsed) ? parsed : 0;
          });
        }

        function weightedPrice(priceCurve, loadCurve) {
          const totalLoad = loadCurve.reduce((total, value) => total + value, 0);
          if (totalLoad === 0) return null;

          return priceCurve.reduce(
            (total, price, index) => total + price * (loadCurve[index] / totalLoad),
            0,
          );
        }

        function calculate(noPv2026, customer2027) {
          const province2026 = weightedPrice(MARKET_CURVE_2026, PROVINCE_LOAD);
          const customer2026 = weightedPrice(MARKET_CURVE_2026, toNumbers(noPv2026));
          const province2027 = weightedPrice(marketCurve2027, PROVINCE_LOAD);
          const weighted2027 = weightedPrice(marketCurve2027, toNumbers(customer2027));

          return {
            curve2026:
              province2026 === null || customer2026 === null
                ? null
                : province2026 - customer2026,
            curve2027:
              province2027 === null || weighted2027 === null
                ? null
                : province2027 - weighted2027,
          };
        }

        function formatNumber(value) {
          return value === null || !Number.isFinite(value)
            ? '--'
            : value.toLocaleString('zh-CN', {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2,
              });
        }

        globalThis.CalculatorCore = Object.freeze({
          defaults: Object.freeze({
            noPv2026: Object.freeze([...DEFAULT_NO_PV_2026]),
            customer2027: Object.freeze([...DEFAULT_CUSTOMER_2027]),
          }),
          calculate,
          formatNumber,
        });
      })();
    </script>

    <script id="calculator-ui">
      (() => {
        'use strict';

        const core = globalThis.CalculatorCore;
        const state = {
          noPv2026: [...core.defaults.noPv2026],
          customer2027: [...core.defaults.customer2027],
        };

        function toInput(value) {
          return Number(value).toFixed(4).replace(/\.?0+$/, '');
        }

        function renderInputs(containerId, curveName, label, values) {
          const container = document.getElementById(containerId);
          container.replaceChildren();

          values.forEach((value, index) => {
            const hour = String(index + 1).padStart(2, '0');
            const wrapper = document.createElement('label');
            wrapper.className = 'hour-input';

            const caption = document.createElement('span');
            caption.textContent = `${hour}:00`;

            const input = document.createElement('input');
            input.type = 'number';
            input.step = 'any';
            input.inputMode = 'decimal';
            input.value = toInput(value);
            input.dataset.curve = curveName;
            input.dataset.index = String(index);
            input.setAttribute('aria-label', `${label} ${hour}:00`);

            wrapper.append(caption, input);
            container.append(wrapper);
          });
        }

        function renderResults() {
          const result = core.calculate(state.noPv2026, state.customer2027);
          document.getElementById('result-2026').textContent = core.formatNumber(result.curve2026);
          document.getElementById('result-2027').textContent = core.formatNumber(result.curve2027);
        }

        function createSvgElement(name, attributes = {}) {
          const element = document.createElementNS('http://www.w3.org/2000/svg', name);
          Object.entries(attributes).forEach(([attribute, value]) => {
            element.setAttribute(attribute, String(value));
          });
          return element;
        }

        function renderCurveChart(containerId, values, label) {
          const container = document.getElementById(containerId);
          const numericValues = values.map((value) => {
            const parsed = Number(value);
            return Number.isFinite(parsed) ? parsed : 0;
          });
          const width = 960;
          const height = 200;
          const padding = { top: 18, right: 16, bottom: 34, left: 54 };
          const chartWidth = width - padding.left - padding.right;
          const chartHeight = height - padding.top - padding.bottom;
          const dataMinimum = Math.min(...numericValues);
          const dataMaximum = Math.max(...numericValues);
          const flatPadding = dataMaximum === 0 ? 1 : Math.abs(dataMaximum) * 0.1;
          const minimum = dataMinimum === dataMaximum
            ? dataMinimum - flatPadding
            : Math.min(dataMinimum, 0);
          const maximum = dataMinimum === dataMaximum
            ? dataMaximum + flatPadding
            : Math.max(dataMaximum, 0);
          const range = maximum - minimum;
          const xFor = (index) => padding.left + (chartWidth * index) / (numericValues.length - 1);
          const yFor = (value) => padding.top + ((maximum - value) / range) * chartHeight;
          const svg = createSvgElement('svg', {
            viewBox: `0 0 ${width} ${height}`,
            role: 'img',
            'aria-label': `${label}，共 24 个小时负荷点`,
          });
          const title = createSvgElement('title');
          title.textContent = `${label}预览`;
          svg.append(title);

          [0, 0.5, 1].forEach((ratio) => {
            const y = padding.top + chartHeight * ratio;
            svg.append(createSvgElement('line', {
              x1: padding.left,
              x2: width - padding.right,
              y1: y,
              y2: y,
              class: 'chart-grid-line',
              'aria-hidden': 'true',
            }));
          });

          const zeroY = yFor(0);
          svg.append(createSvgElement('line', {
            x1: padding.left,
            x2: width - padding.right,
            y1: zeroY,
            y2: zeroY,
            class: 'chart-zero-line',
            'aria-hidden': 'true',
          }));

          const points = numericValues.map((value, index) => `${xFor(index)},${yFor(value)}`);
          svg.append(createSvgElement('polyline', {
            points: points.join(' '),
            class: 'chart-line',
            'aria-hidden': 'true',
          }));

          numericValues.forEach((value, index) => {
            svg.append(createSvgElement('circle', {
              cx: xFor(index),
              cy: yFor(value),
              r: 3.5,
              class: 'chart-point',
              'aria-hidden': 'true',
            }));
          });

          [0, 11, 23].forEach((index) => {
            const hour = String(index + 1).padStart(2, '0');
            const text = createSvgElement('text', {
              x: xFor(index),
              y: height - 10,
              'text-anchor': index === 0 ? 'start' : index === 23 ? 'end' : 'middle',
              class: 'chart-label',
              'aria-hidden': 'true',
            });
            text.textContent = `${hour}:00`;
            svg.append(text);
          });

          [maximum, minimum].forEach((value) => {
            const text = createSvgElement('text', {
              x: padding.left - 8,
              y: yFor(value) + 4,
              'text-anchor': 'end',
              class: 'chart-label',
              'aria-hidden': 'true',
            });
            text.textContent = toInput(value);
            svg.append(text);
          });

          container.replaceChildren(svg);
        }

        function renderAll() {
          renderInputs(
            'curve-2026',
            'noPv2026',
            '2026 无光伏客户负荷曲线',
            state.noPv2026,
          );
          renderInputs(
            'curve-2027',
            'customer2027',
            '2027 客户负荷曲线',
            state.customer2027,
          );
          renderCurveChart('curve-chart-2026', state.noPv2026, '2026 无光伏客户负荷曲线');
          renderCurveChart('curve-chart-2027', state.customer2027, '2027 客户负荷曲线');
          renderResults();
        }

        document.getElementById('app').addEventListener('input', (event) => {
          if (!(event.target instanceof HTMLInputElement)) return;
          const input = event.target.closest('input[data-curve][data-index]');
          if (!input) return;

          state[input.dataset.curve][Number(input.dataset.index)] = input.value;
          renderCurveChart(
            input.dataset.curve === 'noPv2026' ? 'curve-chart-2026' : 'curve-chart-2027',
            state[input.dataset.curve],
            input.dataset.curve === 'noPv2026'
              ? '2026 无光伏客户负荷曲线'
              : '2027 客户负荷曲线',
          );
          renderResults();
        });

        document.getElementById('reset-button').addEventListener('click', () => {
          state.noPv2026 = Array(24).fill(0);
          state.customer2027 = Array(24).fill(0);
          renderAll();
        });

        renderAll();
      })();
    </script>
  </body>
</html>
