<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>贵州电力套利分析 · 报告日历</title>
<style>
  :root {
    --bg: #f5f7fa; --card: #ffffff; --border: #e5e7eb;
    --text: #1f2733; --muted: #6b7280; --accent: #0d9488;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: 'Segoe UI', -apple-system, 'Microsoft YaHei', sans-serif;
    font-size: 14px; line-height: 1.6; padding: 28px 16px 48px;
  }
  .wrap { max-width: 760px; margin: 0 auto; }
  header { margin-bottom: 18px; }
  h1 { font-size: 20px; font-weight: 700; letter-spacing: .5px; }
  h1 span { color: var(--accent); }
  .sub { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 16px 18px 20px;
    box-shadow: 0 1px 3px rgba(0,0,0,.04);
  }
  .cal-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 12px;
  }
  .cal-head button {
    width: 32px; height: 32px; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--border); background: #fff; color: var(--text);
    font-size: 15px; line-height: 1;
  }
  .cal-head button:hover { border-color: var(--accent); color: var(--accent); }
  .label { font-size: 15px; font-weight: 600; }
  .weekdays, .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .weekdays { margin-bottom: 6px; }
  .weekdays div {
    text-align: center; font-size: 12px; color: var(--muted); padding: 4px 0;
  }
  .cell {
    aspect-ratio: 1 / 1; border-radius: 8px; display: flex;
    align-items: center; justify-content: center;
    font-size: 13px; border: 1px solid transparent;
  }
  .cell.blank { visibility: hidden; }
  .cell.off { color: #d1d5db; }
  .cell.has {
    cursor: pointer; background: #eef7f5; border-color: #b9e2da;
    color: var(--accent); font-weight: 700;
  }
  .cell.has:hover { background: var(--accent); border-color: var(--accent); color: #fff; }
  .cell.today { outline: 2px solid #d97706; outline-offset: -2px; }
  .quick { margin-top: 14px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .quick a, .quick button {
    font-size: 12px; padding: 5px 12px; border-radius: 999px; cursor: pointer;
    background: #eef7f5; color: var(--accent); border: 1px solid #b9e2da;
    text-decoration: none;
  }
  .quick a:hover, .quick button:hover { background: var(--accent); color: #fff; }
  .legend { margin-top: 14px; font-size: 12px; color: var(--muted); }
  .legend i {
    display: inline-block; width: 10px; height: 10px; border-radius: 3px;
    background: #eef7f5; border: 1px solid #b9e2da; margin-right: 6px;
    vertical-align: -1px;
  }
  .pick { margin-top: 14px; font-size: 12px; color: var(--muted); }
  .pick input {
    font-family: inherit; font-size: 12px; padding: 5px 8px;
    border: 1px solid var(--border); border-radius: 8px;
    color: var(--text); background: #fff;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>贵州电力现货套利分析 <span>· 报告日历</span></h1>
    <p class="sub">共 219 份日报 · 2026-03-04 ~ 2026-10-11 · 点击高亮日期查看当日报告</p>
  </header>

  <div class="card">
    <div class="cal-head">
      <button id="prev" title="上个月">‹</button>
      <div class="label" id="label"></div>
      <button id="next" title="下个月">›</button>
    </div>
    <div class="weekdays">
      <div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div><div>日</div>
    </div>
    <div class="grid" id="grid"></div>

    <div class="quick">
      <button id="to-latest">最新一期</button>
      <button id="to-first">最早一期</button>
      <span class="pick">或直接选日期：<input type="date" id="picker" min="2026-03-04" max="2026-10-11"></span>
    </div>
    <div class="legend"><i></i>高亮日期 = 有报告可查看；灰色日期无报告</div>
  </div>
</div>

<script>
const DATES = ["2026-03-04","2026-03-05","2026-03-06","2026-03-07","2026-03-08","2026-03-09","2026-03-10","2026-03-11","2026-03-12","2026-03-13","2026-03-14","2026-03-15","2026-03-16","2026-03-17","2026-03-18","2026-03-19","2026-03-20","2026-03-21","2026-03-22","2026-03-23","2026-03-24","2026-03-25","2026-03-26","2026-03-27","2026-03-28","2026-03-29","2026-03-30","2026-03-31","2026-04-01","2026-04-02","2026-04-03","2026-04-04","2026-04-05","2026-04-06","2026-04-07","2026-04-08","2026-04-09","2026-04-10","2026-04-11","2026-04-12","2026-04-13","2026-04-14","2026-04-15","2026-04-16","2026-04-17","2026-04-18","2026-04-19","2026-04-20","2026-04-21","2026-04-22","2026-04-23","2026-04-24","2026-04-25","2026-04-26","2026-04-27","2026-04-28","2026-04-29","2026-04-30","2026-05-01","2026-05-02","2026-05-03","2026-05-04","2026-05-05","2026-05-06","2026-05-07","2026-05-08","2026-05-09","2026-05-10","2026-05-11","2026-05-12","2026-05-13","2026-05-14","2026-05-15","2026-05-16","2026-05-17","2026-05-18","2026-05-22","2026-05-23","2026-05-24","2026-05-25","2026-05-26","2026-05-27","2026-05-28","2026-05-29","2026-05-30","2026-05-31","2026-06-01","2026-06-02","2026-06-03","2026-06-04","2026-06-05","2026-06-06","2026-06-07","2026-06-08","2026-06-09","2026-06-10","2026-06-11","2026-06-12","2026-06-13","2026-06-14","2026-06-15","2026-06-16","2026-06-17","2026-06-18","2026-06-19","2026-06-20","2026-06-21","2026-06-22","2026-06-23","2026-06-24","2026-06-25","2026-06-26","2026-06-27","2026-06-28","2026-06-29","2026-06-30","2026-07-01","2026-07-02","2026-07-03","2026-07-04","2026-07-05","2026-07-06","2026-07-07","2026-07-08","2026-07-09","2026-07-10","2026-07-11","2026-07-12","2026-07-13","2026-07-14","2026-07-15","2026-07-16","2026-07-17","2026-07-18","2026-07-19","2026-07-20","2026-07-21","2026-07-22","2026-07-23","2026-07-24","2026-07-25","2026-07-26","2026-07-27","2026-07-28","2026-07-29","2026-07-30","2026-07-31","2026-08-01","2026-08-02","2026-08-03","2026-08-04","2026-08-05","2026-08-06","2026-08-07","2026-08-08","2026-08-09","2026-08-10","2026-08-11","2026-08-12","2026-08-13","2026-08-14","2026-08-15","2026-08-16","2026-08-17","2026-08-18","2026-08-19","2026-08-20","2026-08-21","2026-08-22","2026-08-23","2026-08-24","2026-08-25","2026-08-26","2026-08-27","2026-08-28","2026-08-29","2026-08-30","2026-08-31","2026-09-01","2026-09-02","2026-09-03","2026-09-04","2026-09-05","2026-09-06","2026-09-07","2026-09-08","2026-09-09","2026-09-10","2026-09-11","2026-09-12","2026-09-13","2026-09-14","2026-09-15","2026-09-16","2026-09-17","2026-09-18","2026-09-19","2026-09-20","2026-09-21","2026-09-22","2026-09-23","2026-09-24","2026-09-25","2026-09-26","2026-09-27","2026-09-28","2026-09-29","2026-09-30","2026-10-01","2026-10-02","2026-10-03","2026-10-04","2026-10-05","2026-10-06","2026-10-07","2026-10-08","2026-10-09","2026-10-10","2026-10-11"];
const SET = new Set(DATES);
const FIRST = DATES[0];
const LAST = DATES[DATES.length - 1];

const pad = n => String(n).padStart(2, '0');
const grid = document.getElementById('grid');
const label = document.getElementById('label');

let curYear, curMonth;
{
  const [y, m] = LAST.split('-').map(Number);
  curYear = y; curMonth = m;
}

function isoOf(y, m, d) { return `${y}-${pad(m)}-${pad(d)}`; }

function render() {
  label.textContent = `${curYear} 年 ${curMonth} 月`;
  grid.innerHTML = '';

  // 周一为一周起点：JS getDay() 中 0=周日
  const offset = (new Date(curYear, curMonth - 1, 1).getDay() + 6) % 7;
  const total = new Date(curYear, curMonth, 0).getDate();

  for (let i = 0; i < offset; i++) {
    const b = document.createElement('div');
    b.className = 'cell blank';
    grid.appendChild(b);
  }
  for (let d = 1; d <= total; d++) {
    const iso = isoOf(curYear, curMonth, d);
    const el = document.createElement('div');
    el.textContent = d;
    if (SET.has(iso)) {
      el.className = 'cell has';
      el.title = `${iso} · 查看当日报告`;
      el.onclick = () => { location.href = `report_${iso}.html`; };
    } else {
      el.className = 'cell off';
    }
    grid.appendChild(el);
  }
}

function goMonth(delta) {
  curMonth += delta;
  if (curMonth < 1) { curMonth = 12; curYear--; }
  if (curMonth > 12) { curMonth = 1; curYear++; }
  render();
}

function gotoDate(iso) {
  if (!iso) return;
  const [y, m] = iso.split('-').map(Number);
  curYear = y; curMonth = m;
  render();
}

document.getElementById('prev').onclick = () => goMonth(-1);
document.getElementById('next').onclick = () => goMonth(1);
document.getElementById('to-latest').onclick = () => gotoDate(LAST);
document.getElementById('to-first').onclick = () => gotoDate(FIRST);
document.getElementById('picker').onchange = e => {
  const v = e.target.value;
  if (!v) return;
  gotoDate(v);
  if (SET.has(v)) location.href = `report_${v}.html`;
};

render();
</script>
</body>
</html>
